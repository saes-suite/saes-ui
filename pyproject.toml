[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saes-ui"
version = "0.1.0"
description = "Interactive Web & Desktop Interface for Stochastic Algorithm Evaluation Suite"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SAES Team" }
]
dependencies = [
    "saes>=0.1.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "streamlit>=1.30.0",
    "kaleido>=1.3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.uv.sources]
saes = { path = "../saes", editable = true }

[project.scripts]
saes-gui = "saes_ui.app:run_cli"
saes-ui = "saes_ui.app:run_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/saes_ui"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

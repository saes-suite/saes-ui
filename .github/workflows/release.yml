name: Release Stamp

on:
  pull_request:
    types: [closed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        default: minor
        options:
          - minor
          - patch
          - major

permissions:
  contents: write

jobs:
  release:
    name: Stamp Changelog & Bump Version
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Generate Release App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Determine bump type from branch name or manual input
        id: bump
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "branch=manual" >> "$GITHUB_OUTPUT"
            echo "author=@${{ github.actor }}" >> "$GITHUB_OUTPUT"
            echo "bump=${{ inputs.bump }}" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${{ github.event.pull_request.head.ref }}"
            AUTHOR="@${{ github.event.pull_request.user.login }}"

            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"

            if [[ "$BRANCH" == major/* || "$BRANCH" == major-* ]]; then
              echo "bump=major" >> "$GITHUB_OUTPUT"
            elif [[ "$BRANCH" == patch/* || "$BRANCH" == patch-* || \
                    "$BRANCH" == fix/* || "$BRANCH" == fix-* || \
                    "$BRANCH" == hotfix/* || "$BRANCH" == hotfix-* ]]; then
              echo "bump=patch" >> "$GITHUB_OUTPUT"
            else
              echo "bump=minor" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Stamp changelog and bump version
        run: |
          node scripts/release_stamp.cjs \
            --bump "${{ steps.bump.outputs.bump }}" \
            --author "${{ steps.bump.outputs.author }}"

      - name: Commit and push release changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt CHANGELOG.md package.json
          RELEASE_VERSION=$(cat version.txt | sed 's/-SNAPSHOT//')
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          git commit -m "Setting release v${RELEASE_VERSION} from ${{ steps.bump.outputs.branch }} [skip ci]"
          git tag "v${RELEASE_VERSION}"
          git push
          git push origin "v${RELEASE_VERSION}"

      - name: Create GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.commit.outputs.version }}
        run: |
          python3 - <<'EOF'
          import os, pathlib, re

          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(text)
          notes = match.group(0).strip() if match else f"Release v{version}"
          pathlib.Path("release_notes.md").write_text(notes + "\n", encoding="utf-8")
          EOF
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release_notes.md
